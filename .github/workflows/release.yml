name: Build signed Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (must match updater.py, for example 1.8.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = python -c "import updater; print(updater.VERSION)"
          if ($version -ne $env:REQUESTED_VERSION) { throw "Version does not match updater.py" }
      - name: Install test browser
        run: python -m playwright install chromium --only-shell
      - name: Run unit tests
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python -m unittest discover -v *>&1 | Tee-Object -FilePath test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate icons
        run: python make_icon.py
      - name: Build EXE
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LecturePilot --version-file version_info.txt --icon app-icon.ico
          --collect-all playwright --collect-all tzdata
          --add-data "update_public_key.txt;." --add-data "index.html;."
          --add-data "visibility.js;." --add-data "tab_audio.js;."
          --add-data "app-icon.png;." --add-data "app-icon.ico;." --add-data "app-icon.svg;."
          --add-data "app-icon-dark.png;." --add-data "app-icon-dark.ico;." --add-data "app-icon-dark.svg;." app.py
      - name: Sign manifest
        shell: pwsh
        env:
          LECTUREPILOT_SIGNING_KEY: ${{ secrets.LECTUREPILOT_SIGNING_KEY }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python update_sign.py dist/LecturePilot.exe $env:REQUESTED_VERSION
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: gh release create "v$env:REQUESTED_VERSION" --draft dist/LecturePilot.exe update.json update.sig --title "Lecture Pilot v$env:REQUESTED_VERSION" --notes "Windows release. See README.txt for setup and limitations."
